name: Revisar botones de Telegram

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch:  # botón para procesar tus pulsaciones al momento

permissions:
  contents: write

concurrency:
  group: agente-linkedin
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Traer la última versión
        run: git pull --ff-only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Procesar botones pulsados
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CADUCA: ${{ secrets.LINKEDIN_TOKEN_CADUCA }}
        run: python revisar.py

      - name: Guardar estado
        run: |
          git config user.name "agente-linkedin[bot]"
          git config user.email "agente-linkedin@users.noreply.github.com"
          git add pendientes.json historial.json
          git diff --staged --quiet || (git commit -m "Borrador procesado" && git pull --rebase && git push)
