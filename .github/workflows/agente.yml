name: Agente LinkedIn

on:
  schedule:
    # Martes (2) y jueves (4) a las 07:00 UTC = 09:00 en verano / 08:00 en invierno (hora de España)
    - cron: "0 7 * * 2,4"
  workflow_dispatch:  # permite lanzarlo a mano con un botón desde GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 1 hora esperando tu respuesta en Telegram + margen

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar el agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CADUCA: ${{ secrets.LINKEDIN_TOKEN_CADUCA }}
        run: python agente.py
