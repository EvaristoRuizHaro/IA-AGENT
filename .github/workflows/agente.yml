name: Agente LinkedIn

on:
  schedule:
    # Todos los días a las 12:00 hora de España.
    # GitHub usa hora UTC, que no cambia con el horario de verano, así que
    # programamos las dos horas posibles y el primer paso descarta la que no toca.
    - cron: "0 10 * * *"   # 12:00 en horario de verano (UTC+2)
    - cron: "0 11 * * *"   # 12:00 en horario de invierno (UTC+1)
  workflow_dispatch:  # permite lanzarlo a mano con un botón desde GitHub

permissions:
  contents: write  # para poder guardar historial.json en el repositorio

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 1 hora esperando tu respuesta en Telegram + margen

    steps:
      - name: Comprobar si toca ejecutar (verano/invierno)
        id: hora
        run: |
          OFFSET=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          echo "Desfase de España ahora: $OFFSET | Disparador: '${{ github.event.schedule }}'"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT     # lanzado a mano: siempre se ejecuta
          elif [ "$OFFSET" = "+0200" ] && [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT
          elif [ "$OFFSET" = "+0100" ] && [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT
          else
            echo "toca=no" >> $GITHUB_OUTPUT
            echo "Este disparador no corresponde a la hora actual de España. Se omite."
          fi

      - name: Descargar el código
        if: steps.hora.outputs.toca == 'si'
        uses: actions/checkout@v4

      - name: Instalar Python
        if: steps.hora.outputs.toca == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar librerías
        if: steps.hora.outputs.toca == 'si'
        run: pip install -r requirements.txt

      - name: Ejecutar el agente
        if: steps.hora.outputs.toca == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CADUCA: ${{ secrets.LINKEDIN_TOKEN_CADUCA }}
        run: python agente.py

      - name: Guardar historial de noticias publicadas
        if: steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "agente-linkedin[bot]"
          git config user.email "agente-linkedin@users.noreply.github.com"
          git add historial.json
          git diff --staged --quiet || (git commit -m "Historial: nueva noticia publicada" && git push)
