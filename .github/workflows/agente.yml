name: Generar borrador

on:
  schedule:
    # Cada día a las 10:00 hora de España (aprox.).
    # GitHub usa hora UTC, que no cambia con el horario de verano: programamos las dos
    # horas posibles y el primer paso descarta la que no toca.
    # Minuto 45 (no 00) porque a en punto GitHub va saturado y retrasa o salta ejecuciones.
    - cron: "45 7 * * *"   # 09:45 en horario de verano (UTC+2)
    - cron: "45 8 * * *"   # 09:45 en horario de invierno (UTC+1)
  workflow_dispatch:  # botón para lanzarlo a mano

permissions:
  contents: write  # para guardar pendientes.json e historial.json

concurrency:
  group: agente-linkedin   # nunca se ejecutan a la vez generar y revisar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar si toca ejecutar (verano/invierno)
        id: hora
        run: |
          OFFSET=$(TZ=Europe/Madrid date +%z)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT
          elif [ "$OFFSET" = "+0200" ] && [ "${{ github.event.schedule }}" = "45 7 * * *" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT
          elif [ "$OFFSET" = "+0100" ] && [ "${{ github.event.schedule }}" = "45 8 * * *" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT
          else
            echo "toca=no" >> $GITHUB_OUTPUT
            echo "Este disparador no corresponde a la hora actual de España. Se omite."
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.toca == 'si'

      - name: Traer la última versión (por si otra ejecución acaba de guardar cambios)
        if: steps.hora.outputs.toca == 'si'
        run: git pull --ff-only

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.toca == 'si'
        with:
          python-version: "3.13"

      - name: Instalar librerías
        if: steps.hora.outputs.toca == 'si'
        run: pip install -r requirements.txt

      - name: Generar borrador y enviarlo a Telegram
        if: steps.hora.outputs.toca == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CADUCA: ${{ secrets.LINKEDIN_TOKEN_CADUCA }}
        run: python generar.py

      - name: Guardar estado
        if: steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "agente-linkedin[bot]"
          git config user.email "agente-linkedin@users.noreply.github.com"
          git add pendientes.json historial.json
          git diff --staged --quiet || (git commit -m "Nuevo borrador pendiente" && git pull --rebase && git push)
