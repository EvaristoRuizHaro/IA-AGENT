name: Generar borrador

on:
  schedule:
    # Cada día hacia las 10:00 hora de España. GitHub a veces se salta o retrasa estas
    # ejecuciones, así que hay varios intentos (y el webhook de Cloudflare lanza otro):
    # el primero que llega a partir de las 09:30 de Madrid genera el borrador y los demás
    # ven que hoy ya se generó y no hacen nada.
    - cron: "45 7 * * *"   # 09:45 en verano / 08:45 en invierno (en invierno se ignora)
    - cron: "45 8 * * *"   # 10:45 en verano / 09:45 en invierno
    - cron: "17 10 * * *"  # repesca: 12:17 en verano / 11:17 en invierno
    - cron: "17 13 * * *"  # repesca: 15:17 en verano / 14:17 en invierno
  workflow_dispatch:       # botón para lanzarlo a mano (siempre genera)
    inputs:
      auto:
        description: "Lo pone el Worker de Cloudflare: 'si' = solo si hoy no se ha generado ya"
        required: false
        default: ""

permissions:
  contents: write  # para guardar pendientes.json e historial.json
  actions: read    # para ver si hoy ya se generó el borrador

concurrency:
  group: agente-linkedin   # nunca se ejecutan a la vez generar y revisar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar si toca ejecutar
        id: hora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HORA=$(TZ=Europe/Madrid date +%H%M)
          echo "Hora Madrid: $HORA | Evento: ${{ github.event_name }} | auto: '${{ inputs.auto }}'"
          # Lanzado a mano desde GitHub: siempre genera
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "si" ]; then
            echo "toca=si" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "$HORA" -lt 0930 ]; then
            echo "toca=no" >> $GITHUB_OUTPUT; echo "Aún no son las 09:30 en Madrid. Se omite."; exit 0
          fi
          # ¿Alguna ejecución de hoy ya generó el borrador?
          HOY=$(TZ=Europe/Madrid date +%F)
          for id in $(gh run list -R "${{ github.repository }}" -w agente.yml -s success -L 20 \
                        --json databaseId,createdAt -q '.[] | select(.createdAt >= "'"$(date -u -d "$HOY 00:00 $(TZ=Europe/Madrid date +%z)" +%FT%TZ)"'") | .databaseId'); do
            if gh run view "$id" -R "${{ github.repository }}" --json jobs \
                 -q '.jobs[].steps[] | select(.name=="Generar borrador y enviarlo a Telegram" and .conclusion=="success") | .name' \
                 | grep -q .; then
              echo "toca=no" >> $GITHUB_OUTPUT; echo "Hoy ya se generó el borrador (ejecución $id). Se omite."; exit 0
            fi
          done
          echo "toca=si" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.hora.outputs.toca == 'si'

      - name: Traer la última versión (por si otra ejecución acaba de guardar cambios)
        if: steps.hora.outputs.toca == 'si'
        run: git pull --ff-only

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.toca == 'si'
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar librerías
        if: steps.hora.outputs.toca == 'si'
        run: pip install -r requirements.txt

      - name: Generar borrador y enviarlo a Telegram
        if: steps.hora.outputs.toca == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CADUCA: ${{ secrets.LINKEDIN_TOKEN_CADUCA }}
        run: python generar.py

      - name: Guardar estado
        if: steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "agente-linkedin[bot]"
          git config user.email "agente-linkedin@users.noreply.github.com"
          git add pendientes.json historial.json
          git diff --staged --quiet || (git commit -m "Nuevo borrador pendiente" && git pull --rebase && git push)

      - name: Avisarte por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ El agente ha fallado en «${{ github.workflow }}». Detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
